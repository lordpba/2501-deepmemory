[project]
name = "2501-deepmemory"
version = "1.1.0"
description = "2501 DeepMemory — A portable, encrypted LLM Ghost Wiki"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "pillow>=10.0.0",
    "beautifulsoup4>=4.12.0",
]

[tool.ruff]
# Target version for Python
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
